name: Verify production

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production and verify address UI
        shell: bash
        run: |
          set -e
          URL="https://atlasintakeinteractiveprototype.vercel.app/?verify=${GITHUB_SHA}"
          for i in $(seq 1 36); do
            BODY="$(curl -fsSL --max-time 15 "$URL" || true)"
            if printf '%s' "$BODY" | grep -q 'addAddressBtn' && printf '%s' "$BODY" | grep -q 'BCBA Certification Number'; then
              echo "Production contains the address update and analyst correction."
              exit 0
            fi
            echo "Attempt $i: production has not updated yet."
            sleep 5
          done
          echo "Production did not update within 3 minutes."
          exit 1
