name: Browser probe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[probe-result]') && !contains(github.event.head_commit.message, '[browser-probe-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser-control library
        shell: bash
        run: |
          npm install --prefix /tmp/atlas-probe playwright-core@1.55.0 --no-save --no-package-lock

      - name: Render and inspect the actual production DOM
        shell: bash
        env:
          URL: https://atlasintakeinteractiveprototype.vercel.app/?browserprobe=${{ github.sha }}
          NODE_PATH: /tmp/atlas-probe/node_modules
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          (async () => {
            const result = {
              checked_sha: process.env.GITHUB_SHA,
              checked_at: new Date().toISOString(),
              chrome: process.env.CHROME || '',
              requested_url: process.env.URL,
              has_visible_add_button: false,
              has_certification: false,
              has_old_npi: false,
              has_primary_address: false,
              error_box_visible: false,
              body_chars: 0,
              page_title: '',
              final_url: '',
              browser_errors: []
            };

            let browser;
            try {
              browser = await chromium.launch({
                executablePath: process.env.CHROME,
                headless: true,
                args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-gpu']
              });
              const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
              page.on('pageerror', error => result.browser_errors.push(`pageerror: ${error.message}`));
              page.on('console', message => {
                if (message.type() === 'error') result.browser_errors.push(`console: ${message.text()}`);
              });

              await page.goto(process.env.URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForSelector('#addAddressBtn', { state: 'visible', timeout: 45000 });
              await page.waitForTimeout(750);

              const bodyText = await page.locator('body').innerText();
              result.has_visible_add_button = await page.locator('#addAddressBtn').isVisible();
              result.has_certification = bodyText.includes('Certification #1-23-45678');
              result.has_old_npi = bodyText.includes('NPI on profile');
              result.has_primary_address = bodyText.includes('Current primary address');
              result.error_box_visible = await page.locator('#error').isVisible().catch(() => false);
              result.body_chars = bodyText.length;
              result.page_title = await page.title();
              result.final_url = page.url();

              await page.screenshot({ path: 'production.png', fullPage: true });
            } catch (error) {
              result.browser_errors.push(`fatal: ${error.stack || error.message || String(error)}`);
            } finally {
              if (browser) await browser.close();
            }

            const lines = Object.entries(result).map(([key, value]) => {
              if (Array.isArray(value)) return `${key}=${JSON.stringify(value)}`;
              return `${key}=${value}`;
            });
            fs.writeFileSync('BROWSER_PROBE.txt', lines.join('\n') + '\n');
            console.log(lines.join('\n'));
          })();
          NODE

      - name: Commit browser probe result safely
        shell: bash
        run: |
          git config user.name "atlas-browser-probe"
          git config user.email "actions@users.noreply.github.com"
          git add BROWSER_PROBE.txt production.png 2>/dev/null || git add BROWSER_PROBE.txt
          git commit -m "[browser-probe-result] Record rendered production state" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
