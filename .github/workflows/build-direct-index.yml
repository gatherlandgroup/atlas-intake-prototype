name: Build direct Atlas index

on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - '.github/workflows/build-direct-index.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[build-result]') && !contains(github.event.head_commit.message, '[build-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate direct HTML
        shell: bash
        run: |
          set +e
          : > BUILD_RESULT.txt
          echo "source_commit=$GITHUB_SHA" >> BUILD_RESULT.txt
          echo "expected_index_sha=754e2f3be71a4c31321e3c1022ccc72d2de58f17be39b528993c2eb2ee2fd9b4" >> BUILD_RESULT.txt

          rm -f /tmp/atlas.clean.b64 /tmp/atlas.html.gz /tmp/generated-index.html
          for file in payload/part*.txt; do
            clean="/tmp/$(basename "$file").clean"
            tr -d '\r\n\t ' < "$file" > "$clean"
            echo "$(basename "$file")_chars=$(wc -c < "$clean")" >> BUILD_RESULT.txt
            echo "$(basename "$file")_sha=$(sha256sum "$clean" | awk '{print $1}')" >> BUILD_RESULT.txt
            cat "$clean" >> /tmp/atlas.clean.b64
          done

          echo "payload_chars=$(wc -c < /tmp/atlas.clean.b64)" >> BUILD_RESULT.txt
          echo "payload_sha=$(sha256sum /tmp/atlas.clean.b64 | awk '{print $1}')" >> BUILD_RESULT.txt

          base64 -d /tmp/atlas.clean.b64 > /tmp/atlas.html.gz 2>/tmp/base64.err
          decode_status=$?
          echo "base64_status=$decode_status" >> BUILD_RESULT.txt
          echo "base64_error=$(tr '\n' ' ' < /tmp/base64.err)" >> BUILD_RESULT.txt

          if [ "$decode_status" -eq 0 ]; then
            gzip -t /tmp/atlas.html.gz 2>/tmp/gzip-test.err
            gzip_test_status=$?
          else
            gzip_test_status=99
            echo "decode_failed" > /tmp/gzip-test.err
          fi
          echo "gzip_test_status=$gzip_test_status" >> BUILD_RESULT.txt
          echo "gzip_test_error=$(tr '\n' ' ' < /tmp/gzip-test.err)" >> BUILD_RESULT.txt

          build_ok=no
          if [ "$decode_status" -eq 0 ] && [ "$gzip_test_status" -eq 0 ]; then
            gzip -dc /tmp/atlas.html.gz > /tmp/generated-index.html 2>/tmp/gunzip.err
            gunzip_status=$?
            generated_sha=$(sha256sum /tmp/generated-index.html | awk '{print $1}')
            echo "gunzip_status=$gunzip_status" >> BUILD_RESULT.txt
            echo "generated_bytes=$(wc -c < /tmp/generated-index.html)" >> BUILD_RESULT.txt
            echo "generated_sha=$generated_sha" >> BUILD_RESULT.txt
            grep -q '+ Add another address' /tmp/generated-index.html; echo "has_add_address=$([ $? -eq 0 ] && echo yes || echo no)" >> BUILD_RESULT.txt
            grep -q 'Certification #1-23-45678' /tmp/generated-index.html; echo "has_certification=$([ $? -eq 0 ] && echo yes || echo no)" >> BUILD_RESULT.txt
            grep -q 'NPI on profile' /tmp/generated-index.html; echo "has_old_npi=$([ $? -eq 0 ] && echo yes || echo no)" >> BUILD_RESULT.txt
            grep -q 'Background Information' /tmp/generated-index.html; echo "has_background=$([ $? -eq 0 ] && echo yes || echo no)" >> BUILD_RESULT.txt
            if [ "$generated_sha" = "754e2f3be71a4c31321e3c1022ccc72d2de58f17be39b528993c2eb2ee2fd9b4" ]; then
              mv /tmp/generated-index.html index.html
              build_ok=yes
            fi
          fi
          echo "build_ok=$build_ok" >> BUILD_RESULT.txt

      - name: Commit result
        shell: bash
        run: |
          git config user.name "atlas-build"
          git config user.email "actions@users.noreply.github.com"
          if grep -q '^build_ok=yes$' BUILD_RESULT.txt; then
            git add index.html BUILD_RESULT.txt
            message="[build-result] Build direct Atlas Intake"
          else
            git add BUILD_RESULT.txt
            message="[build-diagnostic] Record direct-index build failure"
          fi
          git commit -m "$message" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
