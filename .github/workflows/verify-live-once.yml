name: Verify live Atlas once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser controller
        shell: bash
        run: npm install --prefix /tmp/atlas-live-verify playwright-core@1.55.0 --no-save --no-package-lock

      - name: Verify rendered production and interaction
        shell: bash
        env:
          NODE_PATH: /tmp/atlas-live-verify/node_modules
          LIVE_URL: https://atlasintakeinteractiveprototype.vercel.app/?liveverify=${{ github.sha }}
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const r = {
              checked_at: new Date().toISOString(),
              source_commit: process.env.GITHUB_SHA,
              requested_url: process.env.LIVE_URL,
              final_url: '',
              http_title: '',
              visible_add_button: false,
              additional_card_after_click: false,
              address_type_selector_present: false,
              address_input_present: false,
              remove_button_works: false,
              certification_present: false,
              old_npi_present: false,
              background_nav_present: false,
              ten_sections_present: false,
              body_chars: 0,
              errors: []
            };
            let browser;
            try {
              browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage','--disable-gpu'] });
              const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
              page.on('pageerror', e => r.errors.push('pageerror: ' + e.message));
              page.on('console', m => { if (m.type() === 'error') r.errors.push('console: ' + m.text()); });
              await page.goto(process.env.LIVE_URL, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForSelector('#addAddressBtn', { state: 'visible', timeout: 60000 });
              const text = await page.locator('body').innerText();
              r.final_url = page.url();
              r.http_title = await page.title();
              r.visible_add_button = await page.locator('#addAddressBtn').isVisible();
              r.certification_present = text.includes('Certification #1-23-45678');
              r.old_npi_present = text.includes('NPI on profile');
              r.background_nav_present = text.includes('Background Information');
              r.ten_sections_present = text.includes('Section 1 of 10') && text.includes('Final Review');
              r.body_chars = text.length;
              await page.locator('#addAddressBtn').click();
              await page.waitForSelector('.additional-address', { state: 'visible', timeout: 10000 });
              r.additional_card_after_click = await page.locator('.additional-address').isVisible();
              r.address_type_selector_present = await page.locator('.additional-address select').count() > 0;
              r.address_input_present = await page.locator('.additional-address input[placeholder="Enter full address"]').count() > 0;
              await page.locator('.additional-address .removeAddressBtn').click();
              r.remove_button_works = await page.locator('.additional-address').count() === 0;
              await page.screenshot({ path: 'live-production.png', fullPage: true });
            } catch (e) {
              r.errors.push('fatal: ' + (e.stack || e.message || String(e)));
            } finally {
              if (browser) await browser.close();
            }
            r.passed = r.visible_add_button && r.additional_card_after_click && r.address_type_selector_present && r.address_input_present && r.remove_button_works && r.certification_present && !r.old_npi_present && r.background_nav_present && r.ten_sections_present && r.body_chars > 5000 && r.errors.length === 0;
            fs.writeFileSync('LIVE_VERIFY.txt', Object.entries(r).map(([k,v]) => `${k}=${Array.isArray(v)?JSON.stringify(v):v}`).join('\n') + '\n');
            console.log(fs.readFileSync('LIVE_VERIFY.txt','utf8'));
            if (!r.passed) process.exitCode = 1;
          })();
          NODE

      - name: Commit verification evidence
        if: always()
        shell: bash
        run: |
          git config user.name "atlas-live-verify"
          git config user.email "actions@users.noreply.github.com"
          git add LIVE_VERIFY.txt live-production.png 2>/dev/null || git add LIVE_VERIFY.txt
          git commit -m "[live-verify] Record live Atlas verification" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
