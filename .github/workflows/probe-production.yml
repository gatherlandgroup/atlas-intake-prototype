name: Probe production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[probe-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live production
        shell: bash
        run: |
          set +e
          URL="https://atlasintakeinteractiveprototype.vercel.app/?probe=${GITHUB_SHA}"
          BODY="$(curl -L --max-time 20 -sS -w '\n__HTTP__:%{http_code}\n' "$URL" 2>&1)"
          HTTP="$(printf '%s' "$BODY" | sed -n 's/^__HTTP__://p' | tail -1)"
          HAS_ADDRESS=no
          HAS_CERT=no
          printf '%s' "$BODY" | grep -q 'addAddressBtn' && HAS_ADDRESS=yes
          printf '%s' "$BODY" | grep -q 'BCBA Certification Number' && HAS_CERT=yes
          {
            echo "checked_sha=$GITHUB_SHA"
            echo "http_status=$HTTP"
            echo "has_addAddressBtn=$HAS_ADDRESS"
            echo "has_BCBA_Certification_Number=$HAS_CERT"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > PRODUCTION_PROBE.txt
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "atlas-production-probe"
          git config user.email "actions@users.noreply.github.com"
          git add PRODUCTION_PROBE.txt
          git commit -m "[probe-result] Record production state" || exit 0
          git push
