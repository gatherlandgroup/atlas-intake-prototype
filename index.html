<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Intake Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="atlasFrame" src="legacy.html"></iframe><script>
const frame=document.getElementById('atlasFrame');
function patchAtlas(){
  let d; try{d=frame.contentDocument||frame.contentWindow.document}catch(e){return false}
  if(!d||!d.body)return false;
  const labels=[...d.querySelectorAll('label')];
  const primary=labels.find(l=>l.textContent.trim().startsWith('Current primary address'));
  if(primary&&!d.getElementById('additionalAddresses')){
    const container=d.createElement('div'); container.className='stack'; container.style.marginTop='10px';
    const list=d.createElement('div'); list.id='additionalAddresses'; list.className='stack';
    const add=d.createElement('button'); add.type='button'; add.id='addAddressBtn'; add.className='btn'; add.style.width='max-content'; add.textContent='+ Add another address';
    container.append(list,add); primary.insertAdjacentElement('afterend',container);
    add.addEventListener('click',()=>{
      const card=d.createElement('div'); card.className='card alt stack additional-address';
      card.innerHTML='<div class="between"><strong class="small">Additional address</strong><button type="button" class="btn ghost removeAddressBtn">Remove</button></div><div class="grid2"><label class="small">Where is this address from?<select class="field"><option>Second household</option><option>School / educational program</option><option>Daycare / aftercare</option><option>Other treatment location</option><option>Other</option></select></label><label class="small">Location name / relationship<input class="field" placeholder="e.g., Father\'s home or school name"></label></div><label class="small">Address<input class="field" placeholder="Enter full address"></label>';
      list.appendChild(card); card.querySelector('.removeAddressBtn').addEventListener('click',()=>card.remove());
    });
  }
  [...d.querySelectorAll('p')].forEach(p=>{if(p.textContent.includes('NPI on profile'))p.textContent=p.textContent.replace('NPI on profile','BCBA Certification Number')});
  return !!primary;
}
frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;if(patchAtlas()||tries>50)clearInterval(timer)},150)});
</script></body></html>
