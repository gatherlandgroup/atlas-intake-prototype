<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas Intake — Interactive Prototype</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb;font-family:Inter,system-ui,sans-serif}
    #loading{min-height:100vh;display:grid;place-items:center;color:#667085}
    #error{max-width:760px;margin:48px auto;padding:20px;border:1px solid #e4e7ec;border-radius:16px;background:#fff;color:#172033;display:none}
  </style>
</head>
<body>
  <div id="loading">Loading Atlas Intake…</div>
  <div id="error"></div>
  <script>
  (async () => {
    try {
      const response = await fetch('/legacy.html?v=20260818-address-fix', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Could not load prototype source (${response.status})`);
      const source = await response.text();
      const match = source.match(/const b="([A-Za-z0-9+/=]+)"/);
      if (!match) throw new Error('Prototype source payload was not found.');

      const bytes = Uint8Array.from(atob(match[1]), c => c.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html = await new Response(stream).text();

      const oldAddress = '<label class="small">Current primary address<input class="field" value="Synthetic address for prototype"></label>';
      const newAddress = `<div class="stack" id="addressSection">
        <label class="small">Current primary address<input class="field" value="Synthetic address for prototype"></label>
        <div id="additionalAddresses" class="stack"></div>
        <button type="button" class="btn" id="addAddressBtn" style="width:max-content">+ Add another address</button>
      </div>`;

      if (!html.includes('id="addAddressBtn"')) {
        if (!html.includes(oldAddress)) throw new Error('Primary-address field could not be located.');
        html = html.replace(oldAddress, newAddress);
      }

      html = html.replace('Alex Morgan, BCBA · NPI on profile', 'Alex Morgan, BCBA · Certification #1-23-45678');

      const addressScript = `<script>
      (() => {
        const addButton = document.getElementById('addAddressBtn');
        const list = document.getElementById('additionalAddresses');
        if (!addButton || !list || addButton.dataset.bound === 'true') return;
        addButton.dataset.bound = 'true';
        addButton.addEventListener('click', () => {
          const card = document.createElement('div');
          card.className = 'card alt stack additional-address';
          card.innerHTML = '<div class="between"><strong class="small">Additional address</strong><button type="button" class="btn ghost removeAddressBtn">Remove</button></div><div class="grid2"><label class="small">Where is this address from?<select class="field"><option>Second household</option><option>School / educational program</option><option>Daycare / aftercare</option><option>Other treatment location</option><option>Other</option></select></label><label class="small">Location name / relationship<input class="field" placeholder="e.g., Father&#39;s home or school name"></label></div><label class="small">Address<input class="field" placeholder="Enter full address"></label>';
          list.appendChild(card);
          card.querySelector('.removeAddressBtn').addEventListener('click', () => card.remove());
        });
      })();
      <\/script>`;

      html = html.replace('</body>', addressScript + '</body>');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.getElementById('loading').style.display = 'none';
      const box = document.getElementById('error');
      box.style.display = 'block';
      box.innerHTML = '<strong>Atlas Intake could not load.</strong><p>' + String(error.message || error) + '</p>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
